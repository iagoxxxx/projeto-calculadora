<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1 class="text-center">Calculadora </h1>
    <form id="calculadoraForm" class="mt-4">
        <div class="mb-3">
            <label for="valor1" class="form-label">Valor 1:</label>
            <input type="number" class="form-control" id="valor1" name="valor1" required>
        </div>
        <div class="mb-3">
            <label for="valor2" class="form-label">Valor 2:</label>
            <input type="number" class="form-control" id="valor2" name="valor2" required>
        </div>
        <div class="mb-3">
            <label for="operacao" class="form-label">Operação:</label>
            <select class="form-select" id="operacao" name="operacao">
                <option value="soma">Soma</option>
                <option value="subtracao">Subtração</option>
                <option value="multiplicacao">Multiplicação</option>
                <option value="divisao">Divisão</option>
              
            </select>
        </div>
        <button type="button" class="btn btn-primary" id="btnCalcular">Calcular</button>
    </form>
    <p class="mt-3">Resultado: <span id="resultado" class="fw-bold"></span></p>

    <script src="script.js"></script>
</body>
</html>
